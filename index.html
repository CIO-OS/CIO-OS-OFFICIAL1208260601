<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CIO-OS Official</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/jpeg" href="logo1.jpg">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        
        /* Arka planın beyaz olduğundan emin oluyoruz */
        body { background-color: #ffffff !important; color: #121212; height: 100vh; display: flex; justify-content: center; align-items: center; position: relative; }
        
        /* Info Button */
        .info-btn { position: absolute; top: 20px; right: 20px; background: #f0f0f0; border: 1px solid #ccc; padding: 8px 16px; border-radius: 20px; cursor: pointer; font-weight: bold; }
        
        .container { text-align: center; padding: 20px; }
        .logo { width: 300px; height: auto; margin-bottom: 20px; }
        
        /* Modal Window */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; }
        .modal-content { background: white; padding: 25px; border-radius: 12px; width: 85%; max-width: 320px; text-align: left; line-height: 1.6; }
        .modal-content h2 { text-align: center; margin-bottom: 12px; color: #121212; }
    </style>
</head>
<body>

    <button class="info-btn" onclick="document.getElementById('myModal').style.display='flex'">Info</button>

    <div class="container">
        <img src="logo1.jpg" alt="CIO-OS Logo" class="logo">
        <h1>CIO-OS Official</h1>
        <p>Website under construction. Coming soon.</p>
    </div>

    <div id="myModal" class="modal" onclick="this.style.display='none'">
        <div class="modal-content" onclick="event.stopPropagation()">
            <h2>CIO-OS Meaning</h2>
            <p><strong>C:</strong> Custom</p>
            <p><strong>I:</strong> Innovator</p>
            <p><strong>O:</strong> Optimized</p>
            <br>
            <p><strong>O:</strong> Operating</p>
            <p><strong>S:</strong> System</p>
        </div>
    </div>

</body>
</html>
